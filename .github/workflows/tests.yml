name: Tests and build

# Tests and a full build on every push and pull request. The site itself is deployed by Vercel
# (vercel.json), which builds only when site/static/version.js changes, i.e. on a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python site/build.py --out dist
