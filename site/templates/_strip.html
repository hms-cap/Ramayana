{% macro strip(e, root, W) %}
<figure class="strip" data-ed="{{ e.id }}" aria-label="{{ e.short }}: {{ e.sargas }} {{ W.subs }} in {{ e.kandas|length }} {{ W.units_pl }}">
  <figcaption><span class="ed-name">{{ e.short }}</span> <span class="ed-count">{{ e.sargas }} {{ W.subs }}, {{ "{:,}".format(e.verses) }} verses</span></figcaption>
  <ol class="strip-row">
  {% for k in e.kandas %}
    <li style="flex-grow: {{ k.sargas }}; --ticks: {{ k.sargas }}">
      <a href="{{ root }}{{ e.id }}/{{ k.n }}/" title="{{ k.en }}: {{ k.sargas }} {{ W.subs }}">
        <span class="kn">{{ unit_sx(k) }}</span>
        <span class="num">{{ k.sargas }}</span>
      </a>
    </li>
  {% endfor %}
  </ol>
</figure>
{% endmacro %}
